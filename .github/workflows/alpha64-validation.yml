name: Validate alpha.64 staging
on:
  push:
    branches: [alpha64-staging]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r qa/requirements.txt
      - run: python qa/run_checks.py
      - run: python tools/build_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-installer
          path: outputs/*-install.zip
          if-no-files-found: error
      - name: Stage the verified alpha.64 installer
        run: |
          file=SanguineLootTools-0.12.0-alpha.64-install.zip
          cp "outputs/$file" "dist/$file"
          git add -f "dist/$file"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Stage verified alpha.64 installer"
          git push origin HEAD:alpha64-staging
